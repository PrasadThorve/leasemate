[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastmcp>=4.2.2",
    "langchain>=1.5.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.23",
    "langsmith>=0.15.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

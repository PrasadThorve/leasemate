# Continuous integration: GitHub runs this on every push to main and on every pull request.
# A red X on the commit means something broke; a green tick means all checks passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only needs to read the code, so give the job's token the least access possible.
permissions:
  contents: read

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Installs uv (and caches downloaded packages between runs).
      # setup-uv needs a full version tag: short tags like @v10 don't exist.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend

      # --locked: install exactly what uv.lock says, and fail if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      # No OpenAI key needed: the tests use fake LLMs.
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs the TypeScript type check (tsc -b) and the Vite production build.
      - name: Type check and build
        run: npm run build